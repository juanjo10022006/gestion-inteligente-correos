server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(api/|docs$|openapi\.json$) {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
